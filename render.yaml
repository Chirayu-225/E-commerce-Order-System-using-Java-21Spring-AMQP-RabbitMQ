# Render Blueprint for the API.  Managed dependencies come from free tiers elsewhere:
#   Postgres -> Neon, Redis -> Upstash (rediss://), RabbitMQ -> CloudAMQP (amqps://).  Frontend -> Vercel.
services:
  - type: web
    name: flashcart-api
    runtime: docker
    rootDir: api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL          # e.g. postgres://...neon.tech/flashcart?sslmode=require
        sync: false
      - key: REDIS_URL             # e.g. rediss://default:...@...upstash.io:6379
        sync: false
      - key: RABBITMQ_URL          # e.g. amqps://...@...cloudamqp.com/vhost
        sync: false
      - key: CORS_ALLOWED_ORIGINS  # your Vercel URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DB_POOL_MAX
        value: "5"
