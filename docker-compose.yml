# One command to run the whole system locally:  docker compose up --build   ->  http://localhost:8081
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: flashcart, POSTGRES_PASSWORD: flashcart, POSTGRES_DB: flashcart }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U flashcart"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]   # management UI: http://localhost:15672 (guest/guest)
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, retries: 12 }

  api:
    build: ./api
    environment:
      NODE_ENV: development                # dev secrets allowed; use production + real secrets when deploying
      DATABASE_URL: postgres://flashcart:flashcart@postgres:5432/flashcart
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      CORS_ALLOWED_ORIGINS: http://localhost:8081
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  web:
    build: ./web
    ports: ["8081:80"]
    depends_on: [api]

volumes:
  pgdata:
