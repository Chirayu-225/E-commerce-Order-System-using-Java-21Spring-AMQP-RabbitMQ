<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FlashCart: flash sales that never oversell." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>FlashCart</title>
    <script>
      // Apply the saved (or OS) theme before first paint so there is no light/dark flash.
      (function () {
        try {
          var t = localStorage.getItem('fc-theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
